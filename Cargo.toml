[package]
name = "forge"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
wgpu = { version = "28", default-features = false, features = ["std", "vulkan", "wgsl"] }
pollster = "0.4"
